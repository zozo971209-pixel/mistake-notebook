name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run android:init -- --skip-targets-install

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEY_BASE64"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/learning-map-release.p12"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/learning-map-release.p12"
            echo "storeType=PKCS12"
          } > src-tauri/gen/android/keystore.properties
          node scripts/configure-android-signing.mjs

      - name: Build signed arm64 APK
        run: npm run android:build -- --ci

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" release/learning-map-android-arm64.apk
          sha256sum release/learning-map-android-arm64.apk > release/learning-map-android-arm64.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: learning-map-android-arm64
          path: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

