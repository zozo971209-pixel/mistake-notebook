name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run tauri -- icon public/app-icon.svg

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw "Windows NSIS installer was not generated" }
          $installerPath = "release/learning-map-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $installerPath
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  learning-map-windows-x64-setup.exe" | Set-Content -LiteralPath "$installerPath.sha256" -NoNewline
          Compress-Archive -LiteralPath $installerPath, "$installerPath.sha256" -DestinationPath release/learning-map-windows-x64.zip
          $zipHash = (Get-FileHash -LiteralPath release/learning-map-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  learning-map-windows-x64.zip" | Set-Content -LiteralPath release/learning-map-windows-x64.zip.sha256 -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: learning-map-windows-x64
          path: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
